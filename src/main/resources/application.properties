spring.application.name=rag-arquitetura

# Banco: padrão para o docker-compose.yml, trocado por variável de ambiente fora dele
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rag}
spring.datasource.username=${DB_USERNAME:rag}
spring.datasource.password=${DB_PASSWORD:rag}

# Ollama do docker-compose.yml e o modelo que transforma texto em vetor
rag.ollama.url=${OLLAMA_URL:http://localhost:11434}
rag.embedding.modelo=nomic-embed-text
rag.embedding.dimensao=768

# Livro baixado pelo scripts/baixar_aosa.py
rag.livro.pasta=data/raw

# Com true, a aplicação lê o livro, grava os trechos no banco e termina
rag.ingestao.executar=false
